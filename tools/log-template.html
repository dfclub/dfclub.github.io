<!DOCTYPE html>
<!--
  ============================================================
  我们的官网 · 更新日志
  ============================================================
  本页由 tools\build-log.mjs 根据仓库的提交记录自动生成，不要手改：
  每次提交（包括在 GitHub 网页上手动提交的）都会变成这里的一条记录，
  时间取提交时间，精确到分钟；标题和正文优先取 tools\log-meta.json 里写好的文案，
  没有登记的提交自动用提交说明和改动行数代替。

  重新生成：在仓库根目录执行  node tools\build-log.mjs
  一键部署脚本会在提交后自动生成并再提交一次。
  ============================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<title>更新日志 · 我们的官网</title>
<!-- 网站图标：与入口页同一枚（三角 + 草方块） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f172a'/%3E%3Cpath d='M16 7 25 25H7z' fill='%23ff6d2d'/%3E%3Crect x='20' y='7' width='6' height='6' fill='%237fc63f'/%3E%3C/svg%3E">
<style>
/* ===== 设计变量：与入口页、我的世界官网同一套 ===== */
:root{
  --bg-dark:#0f172a;
  --bg-card:rgba(255,255,255,.05);
  --glass-border:1px solid rgba(255,255,255,.1);
  --glass-shadow:0 8px 32px rgba(0,0,0,.3);
  --paper:#f8fafc;
  --dim:#cbd5e1;
  --line:rgba(255,255,255,.1);
  --green:#10b981;
  --mc:#00e676;
  --warn:#ffd700;
  --bad:#ef4444;
  --mono:"Consolas","Cascadia Mono",ui-monospace,"PingFang SC",monospace;
  --sans:"Segoe UI","Roboto","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --transition:all .3s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
/* 页面底色：深蓝 + 左上白光斑、右下粉光斑 */
body{
  background-color:var(--bg-dark);
  color:var(--paper);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255,255,255,.08) 0%, transparent 22%),
    radial-gradient(circle at 90% 80%, rgba(233,30,99,.08) 0%, transparent 22%);
  background-attachment:fixed;
}
.grid-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(120% 80% at 20% 0%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(120% 80% at 20% 0%, #000 0%, transparent 78%);
}
.wrap{max-width:1000px;margin:0 auto;padding:34px 22px calc(52px + env(safe-area-inset-bottom,0px))}

/* ---------- 页头 ---------- */
.hero{padding:2px 0 26px;border-bottom:1px solid var(--line)}
.back{
  display:inline-flex;align-items:center;gap:8px;
  min-height:44px;padding:0 18px;
  color:var(--dim);text-decoration:none;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:50px;
  font-size:13px;
  transition:var(--transition);
}
.back:hover{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.hero h1{
  margin-top:14px;
  font-size:clamp(32px,8.6vw,52px);line-height:1.06;letter-spacing:-1.4px;font-weight:900;
  color:#fff;text-shadow:0 10px 30px rgba(0,0,0,.5);
}
.hero .lede{margin-top:12px;color:rgba(255,255,255,.8);font-size:15px;line-height:1.68;max-width:36em}
/* 三个数字：条数 / 跨度 / 最近更新，做成三张玻璃小卡 */
.stats{
  display:grid;grid-template-columns:1fr;gap:10px;
  margin-top:22px;padding:0;list-style:none;
}
.stats li{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.stats b{font-size:.98rem;font-weight:800;letter-spacing:.02em;color:#fff;white-space:nowrap}
.stats span{color:rgba(255,255,255,.7);font-size:.82rem;white-space:nowrap}

/* ---------- 日志列表 ---------- */
.log{margin-top:26px;display:flex;flex-direction:column;gap:14px}
/* 一条记录：一张玻璃卡，鼠标经过时左侧亮起绿条 */
.entry{
  position:relative;
  display:grid;grid-template-columns:1fr;gap:4px;
  padding:20px 20px 20px 22px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  transition:var(--transition);
  overflow:hidden;
}
.entry::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:transparent;transition:var(--transition);
}
.entry:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.entry:hover::before{background:var(--mc)}
.entry time{font-size:.82rem;color:var(--mc);letter-spacing:.02em;font-weight:600}
.entry h2{
  margin-top:4px;
  font-size:1.08rem;font-weight:800;line-height:1.45;color:#fff;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
}
.entry p{margin-top:8px;color:rgba(255,255,255,.78);font-size:.92rem;line-height:1.72;max-width:58em}
/* 「手动提交」标记：玻璃小胶囊 */
.badge{
  font-size:.7rem;font-weight:700;letter-spacing:.06em;
  color:var(--paper);padding:4px 10px;
  border:1px solid rgba(255,255,255,.16);border-radius:999px;
  background:rgba(255,255,255,.08);text-transform:uppercase;
}
.hash{
  display:inline-block;margin-top:8px;
  font-family:var(--mono);font-size:.75rem;color:rgba(255,255,255,.4);letter-spacing:.04em;
}

/* ---------- 页脚 ---------- */
footer{
  display:flex;flex-direction:column;gap:6px;
  margin-top:32px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);
  color:#94a3b8;font-size:.82rem;
}
footer a{color:#94a3b8;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.1);align-self:flex-start;transition:var(--transition)}
footer a:hover{color:#fff;border-color:rgba(255,255,255,.4)}

/* ---------- 响应式：手机单列，桌面时间列固定宽度 ---------- */
@media (min-width:720px){
  .wrap{padding:52px 28px 72px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .entry{grid-template-columns:132px minmax(0,1fr);gap:18px;padding:22px 24px 22px 26px;align-items:start}
  .entry time{padding-top:3px}
  footer{flex-direction:row;justify-content:space-between;align-items:center;gap:16px}
  footer a{align-self:auto}
}
@media (max-width:430px){
  .hero h1{font-size:32px}
  .entry h2{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="wrap">

  <header class="hero">
    <a class="back" href="./index.html">← 返回入口页</a>
    <h1>更新日志</h1>
    <p class="lede">本站每一次改动都记在这里，时间精确到分钟。自动化部署和在 GitHub 网页上手动提交的改动，都会按提交记录收进来。</p>
    <ul class="stats">
      <li><b>{{COUNT}}</b><span>条记录</span></li>
      <li><b>{{SPAN}}</b><span>时间跨度</span></li>
      <li><b>{{UPDATED}}</b><span>最近更新</span></li>
    </ul>
  </header>

  <main class="log" aria-label="更改记录">
{{ENTRIES}}
  </main>

  <footer>
    <span>维护：dfclub</span>
    <span>本页由提交记录自动生成 · {{UPDATED}}</span>
    <a href="./index.html">返回入口页</a>
  </footer>
</div>
</body>
</html>
